name: Shell Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install lint/format tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Verify maintainer tool versions
        run: make verify-tools

      - name: Run shell lint
        run: make lint

      - name: Run format check
        run: make format-check

      - name: Run smoke tests
        run: make test-smoke

      - name: Run campaign tests
        run: make test-campaign

  coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_TMP_ROOT: /var/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Bash coverage
        run: make coverage

      - name: Run Python campaign coverage
        run: make coverage-python

      - name: Upload Bash coverage report
        uses: actions/upload-artifact@v4
        with:
          name: bash-coverage
          path: |
            coverage/coverage.json
            coverage/function-percent.txt
            coverage/index.html
            coverage/line-percent.txt

      - name: Upload Python coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage/python/
